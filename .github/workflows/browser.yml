# The browser suites, on pull requests only. They build and boot the app, so this is slower than
# ci.yml and is not a required check: main is gated by ci.yml alone.
name: Browser suite

on:
  pull_request:

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # One runner per area, so the wall clock is the longest area rather than the sum of them all.
    strategy:
      fail-fast: false
      matrix:
        suite: [storefront, layout, account, admin, cart, a11y]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wicken
          POSTGRES_PASSWORD: wicken
          POSTGRES_DB: wicken
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wicken"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wicken:wicken@127.0.0.1:5432/wicken
      # The app runs as the restricted role here, as it does in production, so a missing grant fails a PR.
      APP_DATABASE_URL: postgresql://wicken_app:ci@127.0.0.1:5432/wicken
      BETTER_AUTH_SECRET: ci-secret-not-used-for-anything-real
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium is ~130MB and never changes between runs of the same Playwright version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      # Next's own build cache; the fallback key means a source change still starts from something warm.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - run: pnpm db:migrate

      # The migration creates the role without a login; each environment gives it one.
      - run: psql "$DATABASE_URL" -c "ALTER ROLE wicken_app LOGIN PASSWORD 'ci'"

      # The suites assert on real products and on the two demo accounts. Seeding is the owner's job.
      - run: pnpm db:seed
        env:
          APP_DATABASE_URL: ''

      - run: pnpm build

      - name: Start the app
        run: |
          pnpm start > app.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 2
          done
          echo "The app did not come up"; cat app.log; exit 1

      - run: pnpm exec playwright test e2e/${{ matrix.suite }}.spec.mjs

      # The report and a failed test's trace and screenshot, to step through without rerunning.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-failure
          path: |
            app.log
            playwright-report/
            test-results/
